version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=
    ports:
      - "3000:8080"
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
